name: Refresh IPL statistics from Cricsheet
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1'
permissions:
  contents: write
jobs:
  import-ipl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and calculate historical IPL statistics
        run: |
          python3 scripts/import_ipl_full.py
          python3 scripts/import_ipl_cricsheet.py
          python3 scripts/build_ipl_records.py
      - name: Commit updated IPL statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/ipl-stats.json lib/data/ipl-matches.zip lib/data/ipl-manifest.json lib/data/ipl-records.json
          if ! git diff --cached --quiet; then
            git commit -m "Import complete IPL history from Cricsheet"
            git push
          fi
