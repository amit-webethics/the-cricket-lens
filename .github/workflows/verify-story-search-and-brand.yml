name: Verify story search and brand settings
on:
  push:
    branches: [verify/story-search-and-brand]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEON_AUTH_BASE_URL: 'https://example.invalid/auth'
      NEON_AUTH_COOKIE_SECRET: 'testing-only-cookie-secret-for-next-build'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --import tsx --test tests/featured-score.test.ts
      - run: npm run test:cms
      - run: npm run build
